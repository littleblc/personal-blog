<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三和弦精通10步检查清单</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            color: #333;
            background-color: #fff;
        }
        
        h1 {
            color: #2c3e50;
            text-align: center;
            border-bottom: 3px solid #3498db;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        
        .chord-name {
            text-align: center;
            font-size: 18px;
            margin-bottom: 30px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
        }
        
        .chord-name input {
            border: none;
            border-bottom: 2px solid #3498db;
            background: transparent;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            padding: 5px;
            min-width: 200px;
        }
        
        .checklist {
            list-style: none;
            padding: 0;
        }
        
        .checklist li {
            margin-bottom: 15px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #3498db;
            display: flex;
            align-items: flex-start;
        }
        
        .checklist input[type="checkbox"] {
            margin-right: 15px;
            margin-top: 3px;
            transform: scale(1.2);
        }
        
        .step-content {
            flex: 1;
        }
        
        .step-number {
            font-weight: bold;
            color: #2c3e50;
        }
        
        .example {
            color: #7f8c8d;
            font-style: italic;
        }
        
        .important-note {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
            text-align: center;
        }
        
        .important-note strong {
            color: #856404;
        }
        
        hr {
            border: none;
            height: 2px;
            background-color: #ecf0f1;
            margin: 30px 0;
        }
        
        @media print {
            body {
                padding: 20px;
            }
            .checklist li {
                break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <h1>三和弦精通10步检查清单</h1>
    
    <div class="chord-name">
        <strong>和弦名称：</strong> <input type="text">
    </div>
    
    <hr>
    
    <ul class="checklist">
        <li>
            <input type="checkbox" id="step1">
            <div class="step-content">
                <label for="step1">
                    <span class="step-number">步骤 1:</span> 以50%速度跟着视频练习（有吉他伴奏和无吉他伴奏两种）。
                </label>
            </div>
        </li>
        
        <li>
            <input type="checkbox" id="step2">
            <div class="step-content">
                <label for="step2">
                    <span class="step-number">步骤 2:</span> 以50%速度练习，同时说出并定位每个三和弦指型中的根音（有伴奏和无伴奏两种）。
                </label>
            </div>
        </li>
        
        <li>
            <input type="checkbox" id="step3">
            <div class="step-content">
                <label for="step3">
                    <span class="step-number">步骤 3:</span> 以50%速度练习，同时说出并定位每个三和弦指型中的音程 <span class="example">(例如: 1-3-5, 3-5-1, 5-1-3)</span>。
                </label>
            </div>
        </li>
        
        <li>
            <input type="checkbox" id="step4">
            <div class="step-content">
                <label for="step4">
                    <span class="step-number">步骤 4:</span> 以50%速度练习，同时说出每个三和弦指型中的音符名称 <span class="example">(例如: C-E-G, E-G-C, G-C-E)</span>。
                </label>
            </div>
        </li>
        
        <li>
            <input type="checkbox" id="step5">
            <div class="step-content">
                <label for="step5">
                    <span class="step-number">步骤 5:</span> 以50%速度跟着练习，注意每根弦上音符/音程的移动。先练习最高声部，然后是中间声部，最后是最低声部，完整走完整个序列。
                </label>
            </div>
        </li>
        
        <li>
            <input type="checkbox" id="step6">
            <div class="step-content">
                <label for="step6">
                    <span class="step-number">步骤 6:</span> 重复步骤1-5，以全速（或75%速度）练习。
                </label>
            </div>
        </li>
        
        <li>
            <input type="checkbox" id="step7">
            <div class="step-content">
                <label for="step7">
                    <span class="step-number">步骤 7:</span> 创造性地演奏这个练习 - 琶音、指弹、滑音等。
                </label>
            </div>
        </li>
        
        <li>
            <input type="checkbox" id="step8">
            <div class="step-content">
                <label for="step8">
                    <span class="step-number">步骤 8 (可选):</span> 以1.25倍、1.5倍或2倍速度演奏练习视频。
                </label>
            </div>
        </li>
        
        <li>
            <input type="checkbox" id="step9">
            <div class="step-content">
                <label for="step9">
                    <span class="step-number">步骤 9:</span> 脱离视频，自己练习，最好配合伴奏或节拍器。
                </label>
            </div>
        </li>
        
        <li>
            <input type="checkbox" id="step10">
            <div class="step-content">
                <label for="step10">
                    <span class="step-number">步骤 10:</span> <strong>在完全不看任何视觉参考的情况下</strong>演奏这些练习 - 能够演奏所有指型，并自己说出所有音符和音程！
                </label>
            </div>
        </li>
    </ul>
    
    <div class="important-note">
        <strong>重要提示:</strong> 除了第5步以外，所有这些步骤同样适用于<strong>纵向指型</strong>！
    </div>
</body>
</html>
